name: Daily refresh

# Pulls new scores, schedules and box scores, then recomputes ratings.
# Runs every 3 hours in season. Each sport is its own job so one failure doesn't block the others.
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma-separated sport ids (default: in-season sports)"
        required: false
        default: "mbb,wbb"
      odds:
        description: "Pull sportsbook prices now (1) instead of on the usual schedule"
        required: false
        default: "0"

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        sport: [mbb, wbb, bsb, sb, cfb]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PG_POOL_MAX: "1"
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_FORCE: ${{ github.event.inputs.odds || '0' }}
      FETCH_DELAY_MS: "350"
      SKIP_ROLLUPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/cli.ts migrate
      - run: npx tsx src/cli.ts daily --sport=${{ matrix.sport }} --plays=1
      - name: Catch up last season if anything is missing
        if: matrix.sport == 'mbb' || matrix.sport == 'wbb'
        run: npx tsx src/cli.ts catchup --sport=${{ matrix.sport }} --plays=1 --limit=2500
      - run: npx tsx src/cli.ts top --sport=${{ matrix.sport }} --n=25

  # Rebuild the stats tables once, after every sport has loaded (each sport's job skips it).
  rollups:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PG_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/cli.ts rollups
