name: Rate history

# Manual: re-rate a run of past seasons oldest first, so each season starts from the one before it, and save each
# season's final ratings as of its last game.
on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport id"
        required: true
      from:
        description: "First season year"
        required: true
      to:
        description: "Last season year"
        required: true

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PG_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/cli.ts migrate
      - run: npx tsx src/cli.ts rate:history --sport=${{ inputs.sport }} --from=${{ inputs.from }} --to=${{ inputs.to }}
