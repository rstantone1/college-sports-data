name: Backfill a season

# Manual: load an entire season for one sport (teams, schedule, every box score, ratings).
# A basketball season is ~6,000 games and takes about 40 minutes at the polite request rate.
on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport id (mbb, wbb, cfb, bsb, sb, msoc, wsoc)"
        required: true
        default: "mbb"
      season:
        description: "ESPN season year (2026-27 hoops = 2027; leave blank for current)"
        required: false
        default: ""
      until:
        description: "Last date to sweep, YYYY-MM-DD (blank = today)"
        required: false
        default: ""
      plays:
        description: "Store play-by-play (1/0)"
        required: false
        default: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      FETCH_DELAY_MS: "350"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/cli.ts migrate
      - name: Backfill
        run: |
          S="--sport=${{ inputs.sport }}"
          [ -n "${{ inputs.season }}" ] && S="$S --season=${{ inputs.season }}"
          U=""; [ -n "${{ inputs.until }}" ] && U="--until=${{ inputs.until }}"
          npx tsx src/cli.ts ingest:teams $S
          npx tsx src/cli.ts ingest:games $S $U
          npx tsx src/cli.ts ingest:box $S --plays=${{ inputs.plays }}
          A=""; [ -n "${{ inputs.until }}" ] && A="--asof=${{ inputs.until }}"
          npx tsx src/cli.ts ratings $S $A
          npx tsx src/cli.ts top $S --n=30
